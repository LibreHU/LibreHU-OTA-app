name: Build

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**", "screenshots/**", ".github/workflows/screenshots.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # rolling release per branch (LibreHU OTA)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode = commit count, versionName = git describe

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Signing key from the secrets (optional)
        env:
          KEYSTORE_B64: ${{ secrets.LIBREHU_KEYSTORE_B64 }}
        run: |
          # Without the secret the repository's keystore/librehu.jks signs the APK (app/build.gradle.kts).
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/librehu.jks"
            echo "LIBREHU_KEYSTORE=$RUNNER_TEMP/librehu.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK (release, R8)
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LibreHU-OTA-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload the R8 reports
        # usage.txt lists the code R8 removed (first place to look for a "class / method not found" crash),
        # configuration.txt the rules applied; no mapping needed, the code is not renamed (proguard-rules.pro).
        uses: actions/upload-artifact@v4
        with:
          name: LibreHU-OTA-r8-${{ github.sha }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: warn

      - name: Rolling release of the branch (LibreHU OTA)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          APP: LibreHU-OTA
        run: |
          # One prerelease per branch, tag latest-<branch>, APK <app>-<branch>.apk; the notes carry the version
          # read by LibreHU OTA (versionCode = commit count, as in app/build.gradle.kts).
          SLUG="${BRANCH//\//-}"
          TAG="latest-$SLUG"
          OUT="$APP-$SLUG.apk"
          cp "$(ls app/build/outputs/apk/release/*.apk | head -n1)" "$OUT"
          CODE=$(git rev-list --count HEAD)
          NAME="$(git describe --tags --always --exclude 'latest-*' --exclude 'build-*')-$BRANCH"
          # SHA-256 of the APK: LibreHU Apps checks the download against it.
          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          printf 'versionCode=%s\nversionName=%s\nbranch=%s\ncommit=%s\nsha256=%s\n\n%s\n' \
            "$CODE" "$NAME" "$BRANCH" "$GITHUB_SHA" "$SHA" "$(git log -1 --pretty=%s)" > notes.txt
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$APP $NAME ($BRANCH)" --notes-file notes.txt --prerelease
          else
            gh release create "$TAG" --title "$APP $NAME ($BRANCH)" --notes-file notes.txt --prerelease --verify-tag
          fi
          # The same notes with the APK name and size, as a file of the release: LibreHU Apps reads it as a download,
          # which does not count against the GitHub API limit (60 requests per hour without an account).
          { printf 'apk=%s\nsize=%s\ndate=%s\n' "$OUT" "$(stat -c %s "$OUT")" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"; cat notes.txt; } > release.txt
          gh release upload "$TAG" "$OUT" release.txt --clobber
          # Numbered copy of this build, so that LibreHU OTA can install an older version; the last 15 per branch kept.
          BTAG="build-$SLUG-$CODE"
          if ! gh release view "$BTAG" >/dev/null 2>&1; then
            git tag -f "$BTAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$BTAG"
            gh release create "$BTAG" "$OUT" --title "$APP $NAME ($BRANCH, $CODE)" --notes-file notes.txt --prerelease --verify-tag
          fi
          gh release list --limit 300 --json tagName --jq ".[].tagName | select(startswith(\"build-$SLUG-\"))" \
            | awk -F- '{ print $NF, $0 }' | sort -n | head -n -15 | cut -d' ' -f2 \
            | while read -r old; do gh release delete "$old" --cleanup-tag -y; done
